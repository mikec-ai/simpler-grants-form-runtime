$schema: https://json-schema.org/draft/2020-12/schema
$id: QuestionPocDetails.yaml
type: object
properties:
  name:
    $ref: QuestionName.yaml
    description: The contact's full name
  title:
    type: string
    examples:
      - Executive Director
    description: The contact's job title or role
  address:
    $ref: QuestionAddress.yaml
    description: The contact's mailing address
  phone:
    $ref: QuestionPhone.yaml
    description: The contact's phone number
  email:
    $ref: email.yaml
    description: The contact's email address
required:
  - name
description: A composite question capturing key details about the primary point of contact
x-ui-schema:
  type: Group
  label: Primary Point of Contact Details
  elements:
    - type: Group
      label: Name
      elements:
        - type: Control
          scope: "#/properties/name/properties/prefix"
          label: Prefix
        - type: Control
          scope: "#/properties/name/properties/firstName"
          label: First Name
        - type: Control
          scope: "#/properties/name/properties/middleName"
          label: Middle Name
        - type: Control
          scope: "#/properties/name/properties/lastName"
          label: Last Name
        - type: Control
          scope: "#/properties/name/properties/suffix"
          label: Suffix
    - type: Control
      scope: "#/properties/title"
      label: Job Title
    - type: Group
      label: Mailing Address
      elements:
        - type: Control
          scope: "#/properties/address/properties/street1"
          label: Street Address (Line 1)
        - type: Control
          scope: "#/properties/address/properties/street2"
          label: Street Address (Line 2)
        - type: Control
          scope: "#/properties/address/properties/city"
          label: City
        - type: Control
          scope: "#/properties/address/properties/state"
          label: State
        - type: Control
          scope: "#/properties/address/properties/country"
          label: Country
        - type: Control
          scope: "#/properties/address/properties/postalCode"
          label: Postal Code
    - type: Group
      label: Phone Number
      elements:
        - type: Control
          scope: "#/properties/phone/properties/countryCode"
          label: Country Code
        - type: Control
          scope: "#/properties/phone/properties/number"
          label: Phone Number
        - type: Control
          scope: "#/properties/phone/properties/extension"
          label: Extension
        - type: Control
          scope: "#/properties/phone/properties/isMobile"
          label: Is Mobile?
    - type: Control
      scope: "#/properties/email"
      label: Email Address
x-mapping-to-cg:
  contacts:
    primary:
      name:
        prefix:
          field: name.prefix
        firstName:
          field: name.firstName
        middleName:
          field: name.middleName
        lastName:
          field: name.lastName
        suffix:
          field: name.suffix
      title:
        field: title
      addresses:
        primary:
          street1:
            field: address.street1
          street2:
            field: address.street2
          city:
            field: address.city
          stateOrProvince:
            field: address.state
          country:
            field: address.country
          postalCode:
            field: address.postalCode
      phones:
        primary:
          countryCode:
            field: phone.countryCode
          number:
            field: phone.number
          extension:
            field: phone.extension
          isMobile:
            field: phone.isMobile
      emails:
        primary:
          field: email
x-mapping-from-cg:
  name:
    prefix:
      field: contacts.primary.name.prefix
    firstName:
      field: contacts.primary.name.firstName
    middleName:
      field: contacts.primary.name.middleName
    lastName:
      field: contacts.primary.name.lastName
    suffix:
      field: contacts.primary.name.suffix
  title:
    field: contacts.primary.title
  address:
    street1:
      field: contacts.primary.addresses.primary.street1
    street2:
      field: contacts.primary.addresses.primary.street2
    city:
      field: contacts.primary.addresses.primary.city
    state:
      field: contacts.primary.addresses.primary.stateOrProvince
    country:
      field: contacts.primary.addresses.primary.country
    postalCode:
      field: contacts.primary.addresses.primary.postalCode
  phone:
    countryCode:
      field: contacts.primary.phones.primary.countryCode
    number:
      field: contacts.primary.phones.primary.number
    extension:
      field: contacts.primary.phones.primary.extension
    isMobile:
      field: contacts.primary.phones.primary.isMobile
  email:
    field: contacts.primary.emails.primary
x-entity:
  - poc
x-tags:
  - person
  - details
