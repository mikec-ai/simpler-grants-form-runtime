$schema: https://json-schema.org/draft/2020-12/schema
$id: QuestionPhone.yaml
type: object
properties: {}
allOf:
  - $ref: Phone.yaml
examples:
  - countryCode: "+1"
    number: 444-456-1230
    isMobile: true
description: A generic phone number question
x-ui-schema:
  type: Group
  label: Phone Number
  elements:
    - type: Control
      scope: "#/properties/countryCode"
      label: Country Code
    - type: Control
      scope: "#/properties/number"
      label: Phone Number
    - type: Control
      scope: "#/properties/extension"
      label: Extension
    - type: Control
      scope: "#/properties/isMobile"
      label: Is Mobile?
x-mapping-to-cg:
  countryCode:
    field: countryCode
  number:
    field: number
  extension:
    field: extension
  isMobile:
    field: isMobile
x-mapping-from-cg:
  countryCode:
    field: countryCode
  number:
    field: number
  extension:
    field: extension
  isMobile:
    field: isMobile
x-tags:
  - generic
  - phone
