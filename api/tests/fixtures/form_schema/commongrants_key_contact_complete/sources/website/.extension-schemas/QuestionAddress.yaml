$schema: https://json-schema.org/draft/2020-12/schema
$id: QuestionAddress.yaml
type: object
properties:
  street1:
    type: string
    description: The primary street address line
  street2:
    type: string
    description: Additional street address information
  city:
    type: string
    description: The city or municipality
  state:
    $ref: USState.yaml
    description: The US state, territory, or "Outside the US"
  stateOrProvince:
    type: string
    description: State or province name (for non-US addresses)
  country:
    type: string
    description: The country
  postalCode:
    type: string
    description: The postal or ZIP code
required:
  - street1
  - city
  - state
  - country
  - postalCode
examples:
  - street1: 456 Main St
    street2: Suite 100
    city: Anytown
    state: CA
    country: US
    postalCode: "12345"
description: A generic address question with US state dropdown and conditional state/province
x-ui-schema:
  type: Group
  label: Address
  elements:
    - type: Control
      scope: "#/properties/street1"
      label: Street Address (Line 1)
    - type: Control
      scope: "#/properties/street2"
      label: Street Address (Line 2)
    - type: Control
      scope: "#/properties/city"
      label: City
    - type: Control
      scope: "#/properties/state"
      label: State
    - type: Control
      scope: "#/properties/stateOrProvince"
      label: State or Province
      rule:
        effect: SHOW
        condition:
          scope: "#/properties/state"
          schema:
            pattern: ^Outside the US$
    - type: Control
      scope: "#/properties/country"
      label: Country
    - type: Control
      scope: "#/properties/postalCode"
      label: Postal Code
x-mapping-to-cg:
  street1:
    field: street1
  street2:
    field: street2
  city:
    field: city
  stateOrProvince:
    field: state
  country:
    field: country
  postalCode:
    field: postalCode
x-mapping-from-cg:
  street1:
    field: street1
  street2:
    field: street2
  city:
    field: city
  state:
    field: stateOrProvince
  country:
    field: country
  postalCode:
    field: postalCode
x-tags:
  - generic
  - address
